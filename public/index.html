<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/cosmic-guide/manifest.json" />
    <link rel="icon" href="/cosmic-guide/icon.png" type="image/png" />
    <!-- Prévia rica ao compartilhar o link (WhatsApp/Telegram/Instagram/X) —
         a Frase do Dia incentiva exatamente esse compartilhamento, e sem
         estas tags o link aparecia pelado, sem imagem nem descrição. URLs
         absolutas de propósito: crawlers de OG não resolvem caminho relativo. -->
    <meta name="description" content="Horóscopo, tarô, mapa astral e leituras místicas — sozinho ou em casal. Seu guia cósmico pessoal." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cosmic Guide" />
    <meta property="og:title" content="Cosmic Guide — seu guia cósmico pessoal" />
    <meta property="og:description" content="Horóscopo, tarô, mapa astral e leituras místicas — sozinho ou em casal. 7 dias grátis." />
    <meta property="og:url" content="https://cosmicguide.cloud/cosmic-guide/" />
    <meta property="og:image" content="https://cosmicguide.cloud/cosmic-guide/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cosmic Guide — seu guia cósmico pessoal" />
    <meta name="twitter:description" content="Horóscopo, tarô, mapa astral e leituras místicas — sozinho ou em casal. 7 dias grátis." />
    <meta name="twitter:image" content="https://cosmicguide.cloud/cosmic-guide/og-image.png" />
    <!-- "Adicionar à Tela de Início" no iPhone (Web Push só funciona no Safari
         depois disso — Apple exige o site instalado como app, não só aberto
         no navegador comum). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cosmic Guide" />
    <link rel="apple-touch-icon" href="/cosmic-guide/icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Splash inline: o bundle JS (~2MB) leva um tempo real pra baixar,
         parsear e o React montar — sem isso, #root fica vazio e a pessoa vê
         tela branca pura até então (achado real de auditoria de performance,
         25/07/2026). React substitui todo o conteúdo de #root ao montar
         (ReactDOM.render), então este bloco desaparece sozinho, sem nenhuma
         limpeza manual necessária. -->
    <style id="cosmic-splash-style">
      #cosmic-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0E0821;
        z-index: 0;
      }
      #cosmic-splash .cosmic-splash-emoji {
        font-size: 48px;
        animation: cosmic-splash-spin 2.2s linear infinite;
      }
      #cosmic-splash .cosmic-splash-label {
        margin-top: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        color: #C4B8E6;
        letter-spacing: 0.3px;
      }
      @keyframes cosmic-splash-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="cosmic-splash">
        <div class="cosmic-splash-emoji">🌙</div>
        <div class="cosmic-splash-label">Cosmic Guide</div>
      </div>
    </div>
  </body>
</html>
