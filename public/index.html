<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/cosmic-guide/manifest.json" />
    <link rel="icon" href="/cosmic-guide/icon.png" type="image/png" />
    <!-- Prévia rica ao compartilhar o link (WhatsApp/Telegram/Instagram/X) —
         a Frase do Dia incentiva exatamente esse compartilhamento, e sem
         estas tags o link aparecia pelado, sem imagem nem descrição. URLs
         absolutas de propósito: crawlers de OG não resolvem caminho relativo. -->
    <meta name="description" content="Horóscopo, tarô, mapa astral e leituras místicas — individual ou em casal. Seu guia cósmico pessoal." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cosmic Guide" />
    <meta property="og:title" content="Cosmic Guide — seu guia cósmico pessoal" />
    <meta property="og:description" content="Horóscopo, tarô, mapa astral e leituras místicas — individual ou em casal. 7 dias grátis." />
    <meta property="og:url" content="https://cosmicguide.cloud/cosmic-guide/" />
    <meta property="og:image" content="https://cosmicguide.cloud/cosmic-guide/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cosmic Guide — seu guia cósmico pessoal" />
    <meta name="twitter:description" content="Horóscopo, tarô, mapa astral e leituras místicas — individual ou em casal. 7 dias grátis." />
    <meta name="twitter:image" content="https://cosmicguide.cloud/cosmic-guide/og-image.png" />
    <!-- "Adicionar à Tela de Início" no iPhone (Web Push só funciona no Safari
         depois disso — Apple exige o site instalado como app, não só aberto
         no navegador comum). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cosmic Guide" />
    <link rel="apple-touch-icon" href="/cosmic-guide/icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    
      /* iOS Safari/WhatsApp (04/08/2026): 100% aqui usa o viewport GRANDE — a
         barra do navegador COBRE o pe da pagina e o ultimo botao de cada tela
         fica embaixo dela ("nao consigo ir pra baixo", relato real no
         lancamento). dvh e o viewport DINAMICO, que ja desconta a barra. */
      @supports (height: 100dvh) {
        html, body, #root { height: 100dvh; }
      }
    
      /* Dois preventivos de iOS/WhatsApp (04/08/2026, cacada ao "nao rola"):
         1. -webkit-overflow-scrolling: alguns WebView (WhatsApp) ainda tratam
            scroll interno como "leve" sem isso — inofensivo nos modernos.
         2. Se QUALQUER coisa injetar touch-action:none inline, vira pan-y:
            tap continua funcionando, arrasto vertical NUNCA morre. */
      #root div { -webkit-overflow-scrolling: touch; }
      #root [style*="touch-action: none"] { touch-action: pan-y !important; }

      /* MOLDURA DE CELULAR NO DESKTOP (08/08/2026). O app e desenhado pra
         celular; esticado numa janela de 1900px o layout premium vira
         panqueca — cards de ponta a ponta, hero sem forma (relato real do
         dono olhando no PC: "ta tudo igual/esticado"). Em tela larga o app
         vive numa coluna de celular centralizada, com o ceu preenchendo as
         laterais — o mesmo enquadramento dos apps premium na web. Só >=600px:
         celular e e2e (viewport 390) nao passam por aqui. */
      @media (min-width: 600px) {
        body {
          background: radial-gradient(1200px 700px at 50% -10%, #241448 0%, #140C2E 45%, #0A0619 100%) fixed #0A0619;
        }
        #root {
          max-width: 480px;
          margin: 0 auto;
          box-shadow: 0 0 80px rgba(0, 0, 0, 0.6), 0 0 1px rgba(179, 123, 255, 0.35);
        }
      }
    </style>
    <!-- Splash inline: o bundle JS (~2MB) leva um tempo real pra baixar,
         parsear e o React montar — sem isso, #root fica vazio e a pessoa vê
         tela branca pura até então (achado real de auditoria de performance,
         25/07/2026). React substitui todo o conteúdo de #root ao montar
         (ReactDOM.render), então este bloco desaparece sozinho, sem nenhuma
         limpeza manual necessária.
         ATENÇÃO: este arquivo é o TEMPLATE. `npx expo export --platform web`
         copia public/index.html pra dist/index.html e injeta as tags de
         script do bundle logo antes da tag de fechamento do body — editar
         dist/ direto é jogado fora no próximo build. Toda mudança de splash
         é AQUI.
         NUNCA escreva a tag de fechamento do body literalmente em lugar
         nenhum deste arquivo (nem dentro de comentário, nem em texto): o
         Expo injeta os scripts na PRIMEIRA ocorrência dela, então uma cópia
         solta aqui em cima faz o bundle inteiro nascer dentro deste
         comentário — nenhum script executa, o app nunca monta e o visitante
         fica preso no splash pra sempre. Aconteceu de verdade em
         29/07/2026; test/splashBodyTag.test.js existe pra travar o deploy
         se voltar.

         29/07/2026 — a espera medida foi de 3,4 a 5,2 segundos no 4G, e até
         aqui o splash não dizia NADA: só uma lua girando e a palavra
         "Cosmic Guide". Alguém que chegou pelo link ficava até 5 segundos
         sem receber uma única promessa, e ~40 visitantes deram zero
         checkout. A promessa abaixo é o mesmo texto do og:description (a
         frase que já convence no preview do link) — como é HTML estático,
         ela pinta no primeiro paint, junto com o splash, ANTES de o bundle
         existir. O tempo morto vira argumento em vez de tela vazia. -->
    <style id="cosmic-splash-style">
      #cosmic-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        text-align: center;
        /* mesmo fundo do app (theme.js colors.background) com o halo do
           gradiente `night` — nada de cor nova, pra não dar salto visual
           quando o React monta por cima. */
        background-color: #0E0821;
        background-image: radial-gradient(ellipse 90% 55% at 50% 24%, #1A1235 0%, #0E0821 72%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 0;
      }
      #cosmic-splash .cosmic-splash-emoji {
        font-size: 48px;
        line-height: 1;
        animation: cosmic-splash-spin 2.2s linear infinite;
      }
      #cosmic-splash .cosmic-splash-label {
        margin-top: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* dourado do theme.js (colors.gold) — vira a marca, não mais um
           rótulo de "carregando". */
        font-size: 22px;
        font-weight: 700;
        color: #FFC85C;
        letter-spacing: 1.6px;
      }
      #cosmic-splash .cosmic-splash-promise {
        margin: 14px 0 0;
        max-width: 300px;
        font-size: 15px;
        line-height: 1.5;
        color: #C4B8E6; /* colors.textSecondary */
      }
      #cosmic-splash .cosmic-splash-trial {
        margin: 18px 0 0;
        padding: 7px 16px;
        border: 1px solid rgba(255, 200, 92, 0.38);
        border-radius: 999px;
        background: rgba(255, 200, 92, 0.10);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: #FFC85C;
      }
      @keyframes cosmic-splash-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="cosmic-splash">
        <div class="cosmic-splash-emoji">🌙</div>
        <div class="cosmic-splash-label">Cosmic Guide</div>
        <p class="cosmic-splash-promise">Horóscopo, tarô, mapa astral e leituras místicas — individual ou em casal.</p>
        <p class="cosmic-splash-trial">7 dias grátis</p>
      </div>
    </div>
    <!-- Tradução do splash SEM esperar o bundle.
         Por que a cópia não vem do t()/lib/i18n.js como todo texto novo do
         app: t() só existe depois que o bundle de ~2MB baixa e o React monta
         — que é exatamente o intervalo que este splash cobre. Usar t() aqui
         significaria promessa nenhuma justo nos 3,4-5,2 segundos que ela
         precisa preencher. Então o PT vive no HTML acima (pinta sem uma
         linha de JS, no primeiro paint) e ES/EN entram por esta troca
         inline, que roda em microssegundos.
         As mesmas 6 frases estão em lib/i18n.js sob splash.promise/
         splash.trial, e test/splashPromise.test.js falha se as duas cópias
         divergirem — a duplicação é obrigatória, o desalinhamento não.
         A ordem de detecção é a MESMA de context/LanguageContext.js
         (?lang= > preferência salva > idioma do navegador), senão o splash
         apareceria num idioma e o app abriria em outro. 'app-language' é a
         chave do AsyncStorage, que na web é localStorage puro, sem prefixo.
         Tudo dentro de try/catch: se algo aqui falhar, o pior caso é o PT
         do HTML continuar na tela — nunca uma tela vazia. -->
    <script id="cosmic-splash-i18n">
      (function () {
        var COPY = {
          es: {
            promise: 'Horóscopo, tarot, carta astral y lecturas místicas — solo o en pareja.',
            trial: '7 días gratis'
          },
          en: {
            promise: 'Horoscope, tarot, birth chart and mystic readings — alone or as a couple.',
            trial: '7 days free'
          }
        };
        try {
          var lang = null;
          var fromUrl = /[?&]lang=(pt|es|en)(?:&|$)/.exec(window.location.search);
          if (fromUrl) lang = fromUrl[1];
          if (!lang) {
            var saved = window.localStorage.getItem('app-language');
            if (saved === 'pt' || saved === 'es' || saved === 'en') lang = saved;
          }
          if (!lang) {
            var nav = (navigator.language || '').toLowerCase();
            lang = nav.indexOf('es') === 0 ? 'es' : nav.indexOf('en') === 0 ? 'en' : 'pt';
          }
          // O Expo resolve %LANG_ISO_CODE% pra "en" fixo no export, e o app é
          // PT por padrão — o documento saía anunciando um idioma que não é o
          // que está escrito nele (leitor de tela pronuncia PT com fonética
          // inglesa). Aqui o atributo passa a ser o idioma de verdade.
          document.documentElement.setAttribute('lang', lang === 'pt' ? 'pt-BR' : lang);
          var copy = COPY[lang];
          if (!copy) return; // pt: o HTML já está certo, não toca em nada
          var promise = document.querySelector('#cosmic-splash .cosmic-splash-promise');
          var trial = document.querySelector('#cosmic-splash .cosmic-splash-trial');
          if (promise) promise.textContent = copy.promise;
          if (trial) trial.textContent = copy.trial;
        } catch (e) {}
      })();
    </script>
  
    <script>
      // MODO DIAGNOSTICO DE TOQUE (04/08/2026) — só liga com #toque na URL.
      // Bug real de lançamento ("não consigo rolar") não reproduzível em
      // emulador: este painel transforma o aparelho do usuário no laboratório.
      (function () {
        if (location.hash !== '#toque') return;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;top:60px;left:8px;right:8px;z-index:99999;background:rgba(0,0,0,.85);color:#0f0;font:11px monospace;padding:8px;border-radius:8px;pointer-events:none;white-space:pre-wrap';
        document.body.appendChild(box);
        var st = { ts: 0, tm: 0, prevTm: 0, lastY: 0 };
        function scroller() {
          var best = null, diff = 0;
          var divs = document.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var el = divs[i], cs = getComputedStyle(el);
            if ((cs.overflowY === 'auto' || cs.overflowY === 'scroll') && el.scrollHeight - el.clientHeight > diff) { diff = el.scrollHeight - el.clientHeight; best = el; }
          }
          return best;
        }
        function pinta() {
          var s = scroller();
          var ta = 'sem-alvo';
          try {
            var el = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
            var partes = [];
            while (el && partes.length < 6) { partes.push(getComputedStyle(el).touchAction); el = el.parentElement; }
            ta = partes.join('>');
          } catch (e) {}
          var NL = String.fromCharCode(10);
          box.textContent = [
            'DIAGNOSTICO DO TOQUE',
            'touchstart: ' + st.ts + '  touchmove: ' + st.tm + ' (bloq: ' + st.prevTm + ')',
            (s ? 'scroller: top=' + Math.round(s.scrollTop) + ' de ' + (s.scrollHeight - s.clientHeight) : 'scroller: NENHUM!'),
            'touch-action (centro): ' + ta,
            'viewport: ' + innerWidth + 'x' + innerHeight + ' vv:' + (window.visualViewport ? Math.round(visualViewport.height) : '-')
          ].join(NL);
        }
        window.addEventListener('touchstart', function () { st.ts++; pinta(); }, { capture: true, passive: true });
        window.addEventListener('touchmove', function (e) { st.tm++; if (e.defaultPrevented) st.prevTm++; pinta(); }, { capture: false, passive: true });
        setInterval(pinta, 800);
        pinta();
      })();
    </script>
  </body>
</html>
